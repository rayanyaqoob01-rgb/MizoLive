pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProps = file("local.properties")
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
        }
        def flutterSdk = properties.getProperty("flutter.sdk")
        if (flutterSdk == null) {
            flutterSdk = System.getenv("FLUTTER_ROOT")
        }
        assert flutterSdk != null : "flutter.sdk not set in local.properties and FLUTTER_ROOT env var is not set"
        return flutterSdk
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.5.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
