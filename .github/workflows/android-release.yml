name: MizoLive Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Decode Firebase google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Configure Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD GitHub Secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mizolive-upload-key.jks
          cat <<EOF > android/key.properties
          storeFile=${{ github.workspace }}/flutter_app/android/app/mizolive-upload-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Signed Release APK
        env:
          MIZO_API_BASE_URL: ${{ secrets.MIZO_API_BASE_URL || 'https://ais-dev-my3putbruhvu76iatjzmm7-15664674133.asia-northeast1.run.app' }}
        run: |
          flutter build apk --release \
            --dart-define=MIZO_API_BASE_URL="$MIZO_API_BASE_URL"

      - name: Build Signed Play Store AAB
        env:
          MIZO_API_BASE_URL: ${{ secrets.MIZO_API_BASE_URL || 'https://ais-dev-my3putbruhvu76iatjzmm7-15664674133.asia-northeast1.run.app' }}
        run: |
          flutter build appbundle --release \
            --dart-define=MIZO_API_BASE_URL="$MIZO_API_BASE_URL"

      - name: Upload Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mizolive-android-release
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
