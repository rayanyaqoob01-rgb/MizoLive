name: MizoLive Build All Platforms (Web, Android, iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  validate:
    name: Analyze & Test Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

  build-web:
    name: Build Production Web (build/web)
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        env:
          MIZO_API_BASE_URL: ${{ secrets.MIZO_API_BASE_URL || 'https://ais-dev-my3putbruhvu76iatjzmm7-15664674133.asia-northeast1.run.app' }}
        run: |
          flutter build web --release \
            --dart-define=MIZO_API_BASE_URL="$MIZO_API_BASE_URL"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizoLive-Web
          path: flutter_app/build/web
          retention-days: 30

  build-android:
    name: Build Android Release APK & AAB
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Firebase google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Configure Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mizolive-upload-key.jks
          cat <<EOF > android/key.properties
          storeFile=${{ github.workspace }}/flutter_app/android/app/mizolive-upload-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Release APK & AAB
        env:
          MIZO_API_BASE_URL: ${{ secrets.MIZO_API_BASE_URL || 'https://ais-dev-my3putbruhvu76iatjzmm7-15664674133.asia-northeast1.run.app' }}
        run: |
          flutter build apk --release \
            --dart-define=MIZO_API_BASE_URL="$MIZO_API_BASE_URL"
          flutter build appbundle --release \
            --dart-define=MIZO_API_BASE_URL="$MIZO_API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MizoLive-release.apk
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/MizoLive-release.aab

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizoLive-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/MizoLive-release.apk
          retention-days: 30

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizoLive-Android-AAB
          path: flutter_app/build/app/outputs/bundle/release/MizoLive-release.aab
          retention-days: 30

  build-ios:
    name: Build Signed iOS IPA
    needs: validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter & CocoaPods dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Decode Firebase GoogleService-Info.plist (if configured)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      - name: Verify Apple Signing Secrets & Build IPA
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.APPLE_EXPORT_OPTIONS_PLIST_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MIZO_API_BASE_URL: ${{ secrets.MIZO_API_BASE_URL || 'https://ais-dev-my3putbruhvu76iatjzmm7-15664674133.asia-northeast1.run.app' }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ] || [ -z "$APPLE_EXPORT_OPTIONS_PLIST_BASE64" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Apple signing secrets are not configured yet. Running unsigned iOS compile check only (no App Store IPA produced)."
            flutter build ios --release --no-codesign \
              --dart-define=MIZO_API_BASE_URL="$MIZO_API_BASE_URL"
            echo "MISSING_APPLE_SIGNING=true" >> "$GITHUB_ENV"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/mizo_dist.p12"
          PP_PATH="$RUNNER_TEMP/mizo_profile.mobileprovision"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          echo "$APPLE_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$EXPORT_PLIST"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/mizo_profile.mobileprovision

          flutter build ipa --release \
            --export-options-plist="$EXPORT_PLIST" \
            --dart-define=MIZO_API_BASE_URL="$MIZO_API_BASE_URL"

          rm -f "$CERT_PATH" "$PP_PATH" "$EXPORT_PLIST"
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload Signed iOS IPA Artifact
        if: env.MISSING_APPLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MizoLive-iOS-IPA
          path: flutter_app/build/ios/ipa/*.ipa
          retention-days: 30
