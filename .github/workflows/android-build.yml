name: MizoLive Android Build (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-android:
    name: Build Android Debug APK, Release APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java 21 (Required by Capacitor 8 Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build Web Assets for Capacitor
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || secrets.MIZO_API_BASE_URL || 'https://ais-dev-my3putbruhvu76iatjzmm7-15664674133.asia-northeast1.run.app' }}
        run: npm run build

      - name: Sync Web Assets to Android Native Project
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Decode Firebase google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MizoLive-debug.apk

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizoLive-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/MizoLive-debug.apk
          retention-days: 30

      - name: Configure Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: Missing required Android release signing GitHub Secrets:"
            echo "  - ANDROID_KEYSTORE_BASE64"
            echo "  - ANDROID_KEYSTORE_PASSWORD"
            echo "  - ANDROID_KEY_ALIAS"
            echo "  - ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mizolive-upload-key.jks
          cat <<EOF > android/key.properties
          storeFile=${{ github.workspace }}/android/app/mizolive-upload-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Signed Release APK & Play Store AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MizoLive-release.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/MizoLive-release.aab

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizoLive-Android-Release-APK
          path: android/app/build/outputs/apk/release/MizoLive-release.apk
          retention-days: 30

      - name: Upload Android Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizoLive-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/MizoLive-release.aab
          retention-days: 30
